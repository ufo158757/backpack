<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澜海湾 · 人物背包系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b07a4a' d='M4 7h16l1 4-1 1v7h-4v-3h-8v3H4v-7l-1-1z'/%3E%3Cpath fill='%23231d19' d='M8 5h8l1 2H7z'/%3E%3Cpath fill='%23d9cfba' d='M7 12h2v2H7zm8 0h2v2h-2z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#141009; --bg2:#1a1510;
  --panel:#211a14; --panel2:#2a211a; --panel3:#33281f;
  --line:#3c322a; --line2:#4a3d31;
  --ink:#d9cfba; --ink-dim:#a89b84; --ink-faint:#7c7160;
  --accent:#c98f4e; --accent2:#b07a4a;
  --gold:#d9b32c; --danger:#c0553f; --ok:#7ba05b;
  /* 分类色 */
  --c-money:#d9b32c; --c-food:#b06f3b; --c-drug:#6d9e5a; --c-tool:#9a8f5e;
  --c-weapon:#c04a3a; --c-wear:#4f6d8f; --c-mat:#a89a66; --c-holy:#7a6a9a; --c-music:#9a5a78;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, #241d14 0%, transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  color:var(--ink);
  font-family:"Songti SC","Noto Serif SC","SimSun","Times New Roman",serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
::selection{background:var(--accent);color:#141009}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;
  padding:18px 16px 14px;max-width:1200px;margin:0 auto;
}
.topbar h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--ink);font-weight:700}
.topbar h1 small{font-size:12px;color:var(--ink-faint);letter-spacing:1px;font-weight:400;margin-left:6px}
.topbar .sub{color:var(--ink-dim);font-size:12px;letter-spacing:1px}

/* ===== 统计条 ===== */
.stats{
  display:flex;flex-wrap:wrap;gap:8px;margin:0 auto 14px;max-width:1200px;padding:0 16px;
}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:8px 14px;display:flex;flex-direction:column;gap:2px;min-width:96px;
}
.stat b{font-size:18px;color:var(--accent);line-height:1}
.stat span{font-size:11px;color:var(--ink-faint);letter-spacing:1px}
.stat.occupied b{color:var(--gold)}
.stat.warn b{color:var(--danger)}

/* ===== 角色栏 ===== */
.rolebar{display:flex;align-items:center;gap:8px;max-width:1200px;margin:0 auto 14px;padding:0 16px;flex-wrap:wrap}
.rolebar-label{font-size:12px;color:var(--ink-faint);letter-spacing:2px;flex:none}
.role-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1;min-width:0}
.role-tab{
  background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;
  padding:6px 26px 6px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;flex:none;min-width:96px;
  position:relative;cursor:pointer;user-select:none;
}
.role-tab:hover{color:var(--ink);border-color:var(--line2)}
.role-tab.on{background:var(--panel3);border-color:var(--accent);color:var(--ink)}
.role-tab .rt-name{font-size:13px;letter-spacing:1px}
.role-tab .rt-meta{font-size:10px;color:var(--ink-faint);letter-spacing:0}
.role-tab.on .rt-meta{color:var(--gold)}
.rt-rename{
  position:absolute;top:3px;right:3px;background:none;border:none;color:var(--ink-faint);
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;padding:0;cursor:pointer;
}
.rt-rename:hover{color:var(--gold);background:var(--panel3)}
.add-role{background:var(--panel3);border:1px solid var(--line2);color:var(--gold);border-radius:8px;padding:8px 12px;font-size:12px;letter-spacing:1px;flex:none;min-height:40px}
.add-role:hover{background:var(--accent);color:#141009;border-color:var(--accent)}

/* ===== 布局 ===== */
.layout{
  display:grid;grid-template-columns:1fr;gap:14px;
  max-width:1200px;margin:0 auto;padding:0 16px 40px;
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel-title{
  font-size:13px;color:var(--ink-dim);letter-spacing:2px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.panel-title .cap{width:10px;height:10px;background:var(--accent);display:inline-block;border-radius:2px}
.panel-title span{color:var(--ink-faint)}
.add-slot{background:var(--panel3);border:1px solid var(--line2);color:var(--gold);border-radius:6px;padding:4px 12px;font-size:12px;letter-spacing:1px;min-height:30px;flex:none}
.add-slot:hover{background:var(--accent);color:#141009;border-color:var(--accent)}
.add-slot.danger:hover{background:var(--danger);color:#fff}
.slot-ctrl{margin-left:auto;display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.panel-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.panel-tab{background:var(--panel2);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;padding:7px 16px;font-size:13px;letter-spacing:2px;min-height:36px}
.panel-tab.on{background:var(--accent);color:#141009;border-color:var(--accent);font-weight:600}
.panel-tab:hover{color:var(--ink);border-color:var(--line2)}

/* ===== 背包网格 ===== */
.bag-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.cell{
  position:relative;border-radius:8px;border:1px dashed var(--line2);
  background:transparent;color:var(--ink-faint);
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px;min-height:74px;transition:transform .12s,box-shadow .12s;
}
.cell:hover{transform:translateY(-1px)}
.cell .idx{font-size:10px;opacity:.55}
.cell.empty:hover{border-color:var(--accent);color:var(--accent)}
.cell.sub{justify-content:center;border-style:solid;border-color:var(--line)}
.cell.sub .sub-txt{font-size:11px;letter-spacing:1px}
.cell.occupied{
  border-style:solid;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), 0 1px 0 rgba(0,0,0,.3);
}
.cell.occupied:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.4)}
.cell.occupied .cell-name{font-size:12px;line-height:1.25;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cell.occupied .cell-qty{font-size:15px;color:#fff;font-weight:700;margin-top:2px}
.cell.occupied .cell-qty small{font-weight:400;opacity:.7;font-size:11px}
.cell.occupied .cell-val{font-size:10px;margin-top:3px;opacity:.85}
.cell.occupied .cell-slot{position:absolute;top:3px;right:5px;font-size:9px;opacity:.7}

/* 分类底色 */
.cat-money{background:linear-gradient(160deg,#a8871f,#6f5a12);border-color:#c9a227}
.cat-food{background:linear-gradient(160deg,#8f5526,#5d3517);border-color:#b06f3b}
.cat-drug{background:linear-gradient(160deg,#4f7a3d,#33501f);border-color:#6d9e5a}
.cat-tool{background:linear-gradient(160deg,#71673f,#4a4327);border-color:#9a8f5e}
.cat-weapon{background:linear-gradient(160deg,#983b2d,#5e2318);border-color:#c04a3a}
.cat-wear{background:linear-gradient(160deg,#3c5472,#253a54);border-color:#4f6d8f}
.cat-mat{background:linear-gradient(160deg,#7d7144,#52482a);border-color:#a89a66}
.cat-holy{background:linear-gradient(160deg,#5c5074,#3a3049);border-color:#7a6a9a}
.cat-music{background:linear-gradient(160deg,#79405e,#4d2839);border-color:#9a5a78}

/* ===== 物品库 ===== */
.lib-search{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;color:var(--ink);font-size:14px;margin-bottom:10px;
}
.lib-search:focus{outline:none;border-color:var(--accent)}
.role-input{
  width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;
  padding:12px 14px;color:var(--ink);font-size:16px;margin:6px 0 4px;
}
.role-input:focus{outline:none;border-color:var(--accent)}
.data-actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.data-text{
  width:100%;min-height:120px;background:var(--panel);border:1px solid var(--line2);
  border-radius:8px;padding:10px 12px;color:var(--ink);font-size:12px;line-height:1.5;
  font-family:Consolas,"Courier New",monospace;resize:vertical;box-sizing:border-box;
}
.data-text:focus{outline:none;border-color:var(--accent)}
.data-text[readonly]{color:var(--ink-dim)}
.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cat-tab{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink-dim);
  border-radius:999px;padding:6px 12px;font-size:12px;letter-spacing:1px;
}
.cat-tab:hover{color:var(--ink);border-color:var(--line2)}
.cat-tab.on{background:var(--accent);color:#141009;border-color:var(--accent);font-weight:600}
.lib-list{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto;padding-right:2px}
.lib-list::-webkit-scrollbar{width:8px}
.lib-list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.item-card{
  display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;cursor:pointer;transition:border-color .12s,transform .12s;
}
.item-card:hover{border-color:var(--accent);transform:translateX(2px)}
.item-card .chip{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.item-card .chip span{width:100%;text-align:center;line-height:34px}
.item-card .meta{min-width:0}
.item-card .meta .nm{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-card .meta .sub{font-size:11px;color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-card .add{
  background:var(--panel3);border:1px solid var(--line2);color:var(--gold);
  border-radius:6px;width:44px;height:44px;font-size:20px;line-height:1;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.item-card .add:hover{background:var(--accent);color:#141009;border-color:var(--accent)}
.lib-empty{color:var(--ink-faint);text-align:center;padding:30px 0;font-size:13px;letter-spacing:1px}

/* ===== 仓库 ===== */
.wh-list{display:flex;flex-direction:column;gap:6px;max-height:700px;overflow-y:auto;padding-right:2px}
.wh-item{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.wh-item .chip{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.wh-item .chip span{width:100%;text-align:center;line-height:34px}
.wh-item .meta{min-width:0}
.wh-item .meta .nm{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-item .meta .sub{font-size:11px;color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-item .wh-qty{font-size:16px;font-weight:700;color:var(--gold);min-width:52px;text-align:right}
.wh-ops{display:flex;gap:6px;flex:none}
.wh-ops button{background:var(--panel3);border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:12px;min-height:38px;letter-spacing:1px}
.wh-ops button:hover{background:var(--accent);color:#141009;border-color:var(--accent)}
.wh-ops button.take-all{color:var(--gold)}
.wh-empty{color:var(--ink-faint);text-align:center;padding:40px 0;font-size:13px;letter-spacing:1px}

/* ===== 详情弹窗 ===== */
.modal{
  position:fixed;inset:0;background:rgba(10,7,4,.7);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:50;
}
.modal.show{display:flex}
.modal-card{
  background:var(--panel2);border:1px solid var(--line2);border-radius:12px;
  max-width:420px;width:100%;padding:20px;max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.modal-head h2{margin:0;font-size:20px;color:var(--ink)}
.modal-head .x{background:none;border:none;color:var(--ink-faint);font-size:22px;padding:4px 8px;border-radius:6px}
.modal-head .x:hover{color:var(--ink);background:var(--panel3)}
.m-chip{font-size:11px;color:#fff;padding:2px 8px;border-radius:999px;display:inline-block;margin-top:6px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.m-stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.m-stat b{display:block;font-size:15px;color:var(--gold)}
.m-stat span{font-size:10px;color:var(--ink-faint);letter-spacing:1px}
.m-sec{margin:10px 0}
.m-sec h3{margin:0 0 6px;font-size:11px;color:var(--ink-faint);letter-spacing:2px;font-weight:600}
.m-sec ul{margin:0;padding-left:18px;color:var(--ink-dim);font-size:13px;line-height:1.6}
.m-note{background:var(--panel3);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--ink-dim);margin-top:10px}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{
  flex:1 1 calc(50% - 5px);border-radius:8px;padding:11px;font-size:14px;border:1px solid var(--line2);
  background:var(--panel3);color:var(--ink);letter-spacing:1px;
}
.btn:hover{background:var(--panel)}
.btn.remove{border-color:var(--danger);color:#e6a89c}
.btn.remove:hover{background:var(--danger);color:#fff}
.btn.removeall{border-color:var(--danger);color:#e6a89c}
.btn.removeall:hover{background:#7a2c20;color:#fff}
.btn.primary{background:var(--accent);color:#141009;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--gold)}
.btn.store{border-color:var(--gold);color:var(--gold)}
.btn.store:hover{background:var(--gold);color:#141009}

/* ===== toast ===== */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--panel3);border:1px solid var(--accent);color:var(--ink);
  padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:60;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--danger);color:#e6b3a8}

/* ===== 桌面 ===== */
@media (min-width:768px){
  .topbar{padding:26px 24px 16px}
  .topbar h1{font-size:26px}
  .stats,.layout,.rolebar{padding-left:24px;padding-right:24px}
  .layout{grid-template-columns:minmax(320px,380px) 1fr;gap:18px}
  .cell{min-height:88px;padding:6px}
  .cell.occupied .cell-name{font-size:13px}
  .cell.occupied .cell-qty{font-size:17px}
  .lib-list{max-height:700px}
  .item-card{padding:9px 12px}
}
@media (max-width:380px){
  .bag-grid{gap:6px}
  .cell{min-height:66px}
  .cell.occupied .cell-name{font-size:11px}
}
</style>
</head>
<body>

<header class="topbar">
  <h1>澜海湾 · 人物背包<small>基础背包 · 12格</small></h1>
  <div class="sub">克苏鲁式荒野生存物资管理</div>
</header>

<div class="stats" id="statsBar"></div>

<div class="rolebar">
  <span class="rolebar-label">角色</span>
  <div class="role-tabs" id="roleTabs"></div>
  <button class="add-role" id="addRoleBtn" title="添加一个新角色">＋ 添加角色</button>
  <button class="add-role" id="dataBtn" title="导入 / 导出背包数据">数据</button>
</div>

<main class="layout">
  <!-- ===== 背包面板 ===== -->
  <section class="panel">
    <div class="panel-tabs" id="panelTabs">
      <button class="panel-tab on" data-v="bag">背包</button>
      <button class="panel-tab" data-v="wh">仓库</button>
    </div>
    <div id="bagView">
      <div class="panel-title"><span class="cap"></span>背包格<span id="bagSlotLabel"></span>
        <span class="slot-ctrl">
          <button class="add-slot danger" id="removeSlotBtn" title="减少一个背包格">－ 减格</button>
          <button class="add-slot" id="addSlotBtn" title="增加一个背包格">＋ 加格</button>
          <button class="add-slot" id="storeAllBtn" title="将背包内所有物品存入共享仓库">全部存入</button>
        </span>
      </div>
      <div class="bag-grid" id="bagGrid"></div>
      <div class="panel-title" style="margin-top:16px"><span class="cap" style="background:var(--gold)"></span>图例：物品占用连续格，点击格查看详情</div>
    </div>
    <div id="whView" hidden>
      <div class="panel-title"><span class="cap" style="background:var(--gold)"></span>共享仓库<span id="whSlotLabel"></span></div>
      <div class="wh-list" id="whList"></div>
    </div>
  </section>

  <!-- ===== 物品库面板 ===== -->
  <section class="panel">
    <div class="panel-title"><span class="cap" style="background:var(--gold)"></span>物品库</div>
    <input class="lib-search" id="search" type="text" placeholder="搜索物品…">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="lib-list" id="libList"></div>
  </section>
</main>

<!-- ===== 详情弹窗 ===== -->
<div class="modal" id="detailModal">
  <div class="modal-card" id="detailCard"></div>
</div>

<!-- ===== 角色编辑弹窗 ===== -->
<div class="modal" id="roleModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="roleModalTitle">添加角色</h2>
      <button class="x" id="roleModalClose" title="关闭">×</button>
    </div>
    <input class="role-input" id="roleInput" type="text" maxlength="20" placeholder="输入角色名称">
    <div class="modal-actions">
      <button class="btn primary" id="roleModalOk">确定</button>
      <button class="btn" id="roleModalCancel">取消</button>
    </div>
  </div>
</div>

<!-- ===== 数据管理弹窗 ===== -->
<div class="modal" id="dataModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>数据管理</h2>
      <button class="x" id="dataModalClose" title="关闭">×</button>
    </div>
    <div class="m-sec">
      <h3>导出（备份 / 迁移）</h3>
      <div class="data-actions">
        <button class="btn primary" id="downloadBtn">下载 JSON 文件</button>
        <button class="btn" id="copyBtn">复制到剪贴板</button>
      </div>
      <textarea class="data-text" id="exportText" readonly></textarea>
    </div>
    <div class="m-sec">
      <h3>导入（恢复数据）</h3>
      <div class="data-actions">
        <button class="btn" id="pickFileBtn">选择文件导入</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <textarea class="data-text" id="importText" placeholder="或直接粘贴 JSON 数据…"></textarea>
      <div class="data-actions">
        <button class="btn primary" id="importBtn">导入</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= 物品数据 ================= */
/* ITEMS: 85 件物品, 字段: id,name,value,cat,effect[],note,slots,stack */
const ITEMS = [
  {name:"钞票",value:1,cat:"money",effect:["货币，可用于交易"],slots:1,stack:60},

const WORLD = {

  order:[],
  current:null,
  filter:"all",
  search:"",
  view:"bag",        // bag | wh

};
const MAX_SLOTS = 20, MIN_SLOTS = 10;

function curRole(){ return WORLD.roles[WORLD.current]; }
function createRole(name){
  const id="role"+(WORLD.order.length+1);
  WORLD.roles[id]={id,name,bagSlots:12,groups:[],nextId:1};
  WORLD.order.push(id);
  return id;
}
function switchRole(id){
  if(WORLD.roles[id]) WORLD.current=id;
  closeDetail(); renderAll();
}
function renameRole(id,name){
  const r=WORLD.roles[id]; if(!r) return;
  r.name=(name||"").trim()||r.name;
  renderRoleTabs();
}

/* ---------- 工具函数 ---------- */
const $ = id => document.getElementById(id);
function occupiedSet(){
  const s=new Set();
  for(const g of curRole().groups) for(const c of g.cells) s.add(c);
  return s;
}
function byCellMap(){
  const m={};
  for(const g of curRole().groups) for(const c of g.cells) m[c]=g;
  return m;
}
function statsData(){
  const role=curRole();
  const occ=occupiedSet();
  let value=0,qty=0;
  for(const g of role.groups){ const it=ITEMS[g.itemId]; value+=g.qty*it.value; qty+=g.qty; }
  return {used:occ.size, groups:role.groups.length, value, qty, bagSlots:role.bagSlots};
}

/* ---------- 渲染：统计条 ---------- */
function renderStats(){
  const s=statsData();
  const pct=s.used/s.bagSlots;
  $("statsBar").innerHTML=
    `<div class="stat occupied"><b>${s.used}/${s.bagSlots}</b><span>已占用格数</span></div>`+
    `<div class="stat"><b>${s.groups}</b><span>物品组</span></div>`+
    `<div class="stat"><b>${s.qty.toLocaleString()}</b><span>携带数量</span></div>`+
    `<div class="stat ${pct>=0.9?'warn':''}"><b>${s.value.toLocaleString()}</b><span>物品总价值</span></div>`;
  $("bagSlotLabel").textContent=`（已占 ${s.used}/${s.bagSlots}）`;
}

/* ---------- 放置逻辑 ---------- */
function findRun(slots){
  const occ=occupiedSet();
  for(let i=0;i+slots<=curRole().bagSlots;i++){
    let ok=true;
    for(let j=0;j<slots;j++){ if(occ.has(i+j)){ok=false;break;} }
    if(ok) return i;
  }
  return -1;
}
function addItem(itemId,qty){
  const role=curRole();
  const item=ITEMS[itemId];
  if(!item||qty<=0) return 0;
  let remaining=qty, added=0;
  // 1) 堆叠到已有同物品组（每组不超过堆叠上限）
  for(const g of role.groups){
    if(remaining<=0) break;
    if(g.itemId===itemId && g.qty<item.stack){
      const add=Math.min(remaining,item.stack-g.qty);
      g.qty+=add; remaining-=add; added+=add;
    }
  }
  // 2) 开新组（每组不超过堆叠上限，超出部分自动拆组）
  while(remaining>0){
    const start=findRun(item.slots);
    if(start<0){ toast("背包空间不足！",true); break; }
    const put=Math.min(remaining,item.stack);
    const cells=[]; for(let j=0;j<item.slots;j++) cells.push(start+j);
    role.groups.push({id:role.nextId++,itemId,qty:put,cells});
    remaining-=put; added+=put;
  }
  render();
  return added;
}
function removeOne(groupId){
  const role=curRole();
  const g=role.groups.find(x=>x.id===groupId);
  if(!g) return;
  const it=ITEMS[g.itemId];
  g.qty--;
  if(g.qty<=0) role.groups=role.groups.filter(x=>x.id!==groupId);
  toast(`${it.name} 移除 1 个`);
  render();
}
function removeAll(groupId){
  const role=curRole();
  const g=role.groups.find(x=>x.id===groupId);
  if(!g) return;
  const it=ITEMS[g.itemId];
  role.groups=role.groups.filter(x=>x.id!==groupId);
  toast(`${it.name} 全部移除（${g.qty} 个）`);
  closeDetail();
  render();
}

/* ---------- 共享仓库 ---------- */
function storeToWarehouse(groupId){
  const role=curRole();
  const g=role.groups.find(x=>x.id===groupId);
  if(!g) return;
  const it=ITEMS[g.itemId];
  WORLD.warehouse[g.itemId]=(WORLD.warehouse[g.itemId]||0)+g.qty;
  role.groups=role.groups.filter(x=>x.id!==groupId);
  toast(`已将 ${it.name} ×${g.qty} 存入共享仓库`);
  closeDetail(); renderAll();
}
function storeAllToWarehouse(){
  const role=curRole();
  if(!role.groups.length){ toast("背包内没有物品", true); return; }
  let n=0;
  for(const g of role.groups){
    WORLD.warehouse[g.itemId]=(WORLD.warehouse[g.itemId]||0)+g.qty;
    n+=g.qty;
  }
  role.groups=[];
  toast(`已将 ${n} 件物品全部存入共享仓库`);
  renderAll();
}
function takeFromWarehouse(itemId,qty){
  const have=WORLD.warehouse[itemId]||0;
  const take=Math.min(qty,have);
  if(take<=0) return;
  const added=addItem(itemId,take);
  if(added>0){
    WORLD.warehouse[itemId]-=added;
    if(WORLD.warehouse[itemId]<=0) delete WORLD.warehouse[itemId];
    renderAll();
    toast(`已从仓库取回 ${ITEMS[itemId].name} ×${added}`);
  } else {
    toast("背包空间不足，未能取回", true);
  }
}
function renderWarehouse(){
  const ids=Object.keys(WORLD.warehouse).filter(id=>WORLD.warehouse[id]>0)
    .sort((a,b)=>ITEMS[+b].value*WORLD.warehouse[b]-ITEMS[+a].value*WORLD.warehouse[a]);
  let total=0;
  for(const id of ids) total+=ITEMS[+id].value*WORLD.warehouse[id];
  $("whSlotLabel").textContent=`所有角色共用 · 总价值 ${total}`;
  if(!ids.length){
    $("whList").innerHTML=`<div class="wh-empty">仓库为空，可从角色背包存入物品</div>`;
    return;
  }
  $("whList").innerHTML=ids.map(id=>{
    const it=ITEMS[+id];
    const qty=WORLD.warehouse[id];
    const chip=CATS[it.cat];
    return `<div class="wh-item" data-id="${id}">
      <div class="chip" style="background:var(${chip.v})"><span>${chip.name[0]}</span></div>
      <div class="meta">
        <div class="nm">${it.name}</div>
        <div class="sub">价值 ${it.value} · ${it.slots}格 · 堆叠${it.stack}</div>
      </div>
      <div class="wh-qty">×${qty}</div>
      <div class="wh-ops">
        <button class="take1" data-t1="${id}">取 1</button>
        <button class="take-all" data-ta="${id}">全取</button>
      </div>
    </div>`;
  }).join("");
  $("whList").querySelectorAll("[data-t1]").forEach(b=>{
    b.addEventListener("click",()=>takeFromWarehouse(+b.dataset.t1,1));
  });
  $("whList").querySelectorAll("[data-ta]").forEach(b=>{
    b.addEventListener("click",()=>takeFromWarehouse(+b.dataset.ta,WORLD.warehouse[b.dataset.ta]));
  });
}
$("storeAllBtn").addEventListener("click",storeAllToWarehouse);

/* ---------- 详情弹窗 ---------- */
function openDetail(groupId){
  const g=curRole().groups.find(x=>x.id===groupId);
  if(!g) return;
  const it=ITEMS[g.itemId];
  const chip=CATS[it.cat];
  const note=it.note?`<div class="m-note">备注：${it.note}</div>`:"";
  $("detailCard").innerHTML=`
    <div class="modal-head">
      <div>
        <h2>${it.name}</h2>
        <span class="m-chip" style="background:var(${chip.v})">${chip.name}</span>
      </div>
      <button class="x" data-x="1">×</button>
    </div>
    <div class="modal-grid">
      <div class="m-stat"><b>${g.qty} / ${it.stack}</b><span>当前 / 堆叠上限</span></div>
      <div class="m-stat"><b>${it.slots} 格</b><span>占用格子</span></div>
      <div class="m-stat"><b>${it.value}</b><span>单件价值</span></div>
      <div class="m-stat"><b>${g.qty*it.value}</b><span>本组总价值</span></div>
    </div>
    <div class="m-sec"><h3>作用</h3><ul>${it.effect.map(e=>`<li>${e}</li>`).join("")}</ul></div>
    ${note}
    <div class="modal-actions">
      <button class="btn store" data-s="1">存入仓库</button>
      <button class="btn remove" data-r="1">移除 1 个</button>
      <button class="btn removeall" data-r="all">移除整组</button>
      <button class="btn primary" data-close="1">关闭</button>
    </div>`;
  $("detailModal").classList.add("show");
  $("detailCard").querySelector('[data-x]').addEventListener("click",closeDetail);
  $("detailCard").querySelector('[data-close]').addEventListener("click",closeDetail);
  $("detailCard").querySelector('[data-s="1"]').addEventListener("click",()=>storeToWarehouse(groupId));
  $("detailCard").querySelector('[data-r="1"]').addEventListener("click",()=>removeOne(groupId));
  $("detailCard").querySelector('[data-r="all"]').addEventListener("click",()=>removeAll(groupId));
}
function closeDetail(){ $("detailModal").classList.remove("show"); }
$("detailModal").addEventListener("click",e=>{ if(e.target===$("detailModal")) closeDetail(); });

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,isErr){
  const t=$("toast");
  t.textContent=msg;
  t.classList.toggle("err",!!isErr);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),1700);
}

/* ---------- 搜索 ---------- */
$("search").addEventListener("input",e=>{ WORLD.search=e.target.value; renderLibrary(); });

/* ---------- 背包格扩容/缩减 ---------- */
function addSlot(){
  const role=curRole();
  if(role.bagSlots >= MAX_SLOTS){ toast(`背包已达上限 ${MAX_SLOTS} 格`, true); return; }
  role.bagSlots += 1;
  toast(`已增加 1 个背包格，当前共 ${role.bagSlots} 格（${MIN_SLOTS}-${MAX_SLOTS}）`);
  render();
}
function removeSlot(){
  const role=curRole();
  if(role.bagSlots <= MIN_SLOTS){ toast(`背包至少保留 ${MIN_SLOTS} 格`, true); return; }
  const occ=occupiedSet();
  if(occ.has(role.bagSlots-1)){ toast("末格有物品占用，请先移出该格物品", true); return; }
  role.bagSlots -= 1;
  toast(`已减少 1 个背包格，当前共 ${role.bagSlots} 格（${MIN_SLOTS}-${MAX_SLOTS}）`);
  render();
}
$("addSlotBtn").addEventListener("click",addSlot);
$("removeSlotBtn").addEventListener("click",removeSlot);

/* ---------- 全局渲染 ---------- */
function render(){ renderStats(); renderBackpack(); }
function renderView(){
  const v=WORLD.view;
  $("bagView").hidden = (v!=="bag");
  $("whView").hidden = (v!=="wh");
  $("panelTabs").querySelectorAll(".panel-tab").forEach(b=>{
    b.classList.toggle("on", b.dataset.v===v);
  });
  if(v==="wh") renderWarehouse();
}
function renderAll(){ render(); renderRoleTabs(); renderView(); }
$("panelTabs").querySelectorAll(".panel-tab").forEach(b=>{
  b.addEventListener("click",()=>{ WORLD.view=b.dataset.v; closeDetail(); renderView(); });
});

/* ---------- 角色栏渲染 ---------- */
const RENAME_ICON=`<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
let roleEditId=null;   // null=新建角色；角色id=重命名
function openRoleModal(id){
  roleEditId=id;
  const r=id?WORLD.roles[id]:null;
  $("roleModalTitle").textContent=r?`重命名「${r.name}」`:"添加角色";
  $("roleInput").value=r?r.name:"";
  $("roleModal").classList.add("show");
  setTimeout(()=>{ try{ $("roleInput").focus(); }catch(e){} },0);
}
function closeRoleModal(){ $("roleModal").classList.remove("show"); roleEditId=null; }
function submitRole(){
  const name=$("roleInput").value.trim();
  if(!name){ try{ $("roleInput").focus(); }catch(e){} toast("名称不能为空", true); return; }
  if(roleEditId===null){
    const id=createRole(name);
    switchRole(id);
    toast(`已添加角色：${name}`);
  }else{
    renameRole(roleEditId,name);
    toast(`已重命名为：${name}`);
  }
  closeRoleModal();
}
function renderRoleTabs(){
  $("roleTabs").innerHTML=WORLD.order.map(id=>{
    const r=WORLD.roles[id];
    return `<div class="role-tab ${WORLD.current===id?'on':''}" data-r="${id}" title="点击切换">
      <span class="rt-name">${r.name}</span>
      <span class="rt-meta">${r.bagSlots}格 · ${r.groups.length}组</span>
      <button class="rt-rename" data-rr="${id}" title="重命名角色">${RENAME_ICON}</button>
    </div>`;
  }).join("");
  $("roleTabs").querySelectorAll(".role-tab").forEach(tab=>{
    tab.addEventListener("click",e=>{
      if(e.target.closest(".rt-rename")) return;
      switchRole(tab.dataset.r);
    });
  });
  $("roleTabs").querySelectorAll(".rt-rename").forEach(btn=>{
    btn.addEventListener("click",e=>{ e.stopPropagation(); openRoleModal(btn.dataset.rr); });
  });
}
$("addRoleBtn").addEventListener("click",()=>openRoleModal(null));
$("roleModalOk").addEventListener("click",submitRole);
$("roleModalCancel").addEventListener("click",closeRoleModal);
$("roleModalClose").addEventListener("click",closeRoleModal);
$("roleModal").addEventListener("click",e=>{ if(e.target===$("roleModal")) closeRoleModal(); });
$("roleInput").addEventListener("keydown",e=>{ if(e.key==="Enter") submitRole(); });

/* ---------- 数据导入 / 导出 ---------- */
function buildJson(){
  return JSON.stringify({
    app:"lanyue-backpack", version:1,
    exportedAt:new Date().toISOString(),
    roles:WORLD.roles, order:WORLD.order, current:WORLD.current,
    warehouse:WORLD.warehouse
  },null,2);
}
function openDataModal(){
  $("exportText").value=buildJson();
  $("importText").value="";
  $("dataModal").classList.add("show");
  setTimeout(()=>{ try{ $("importText").focus(); }catch(e){} },0);
}
function closeDataModal(){ $("dataModal").classList.remove("show"); }
function downloadData(){
  const json=buildJson();
  const blob=new Blob([json],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  const d=new Date();
  const s=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}_${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}`;
  a.download=`澜海湾背包数据_${s}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),500);
  toast("JSON 文件已下载");
}
function copyData(){
  const json=buildJson();
  const ta=$("exportText"); ta.value=json;
  ta.focus(); ta.select();
  try{ ta.setSelectionRange(0,json.length); }catch(e){}
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  if(!ok){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(()=>toast("已复制到剪贴板")).catch(()=>toast("复制失败，请手动选择复制", true));
    } else { toast("复制失败，请手动选择复制", true); }
  } else { toast("已复制到剪贴板"); }
}
function sanitizePayload(p){
  if(!p||typeof p!=="object") throw new Error("数据不是有效对象");
  if(!p.roles||typeof p.roles!=="object"||!Array.isArray(p.order)) throw new Error("缺少角色数据（roles / order）");
  const roles={}; const order=[];
  for(const id of p.order){
    const r=p.roles[id];
    if(!r||typeof r!=="object") continue;
    roles[id]={
      id,
      name:typeof r.name==="string"&&r.name.trim()?r.name:"角色",
      bagSlots:Math.max(MIN_SLOTS,Math.min(MAX_SLOTS,Number(r.bagSlots)||12)),
      groups:Array.isArray(r.groups)?r.groups.filter(g=>
        g&&Number.isInteger(g.itemId)&&ITEMS[g.itemId]&&Array.isArray(g.cells)&&g.cells.length>0&&g.cells.every(Number.isInteger)&&g.qty>0
      ):[],
      nextId:Number(r.nextId)||1
    };
    order.push(id);
  }
  if(!order.length) throw new Error("没有有效的角色数据");
  const warehouse={};
  if(p.warehouse&&typeof p.warehouse==="object"){
    for(const k of Object.keys(p.warehouse)){
      const v=Number(p.warehouse[k]);
      if(Number.isInteger(+k)&&ITEMS[+k]&&v>0) warehouse[k]=v;
    }
  }
  return {roles,order,current:(p.current&&roles[p.current])?p.current:order[0],warehouse};
}
function tryImport(text){
  let p;
  try{ p=JSON.parse(text); }catch(e){ toast("JSON 解析失败，请检查数据", true); return; }
  try{
    const clean=sanitizePayload(p);
    WORLD.roles=clean.roles; WORLD.order=clean.order; WORLD.current=clean.current; WORLD.warehouse=clean.warehouse;
    closeDataModal();
    renderAll(); renderCatTabs(); renderLibrary();
    toast(`导入成功：${clean.order.length} 个角色，仓库 ${Object.keys(clean.warehouse).length} 种物品`);
  }catch(e){ toast("导入失败："+e.message, true); }
}
$("dataBtn").addEventListener("click",openDataModal);
$("dataModalClose").addEventListener("click",closeDataModal);
$("dataModal").addEventListener("click",e=>{ if(e.target===$("dataModal")) closeDataModal(); });
$("downloadBtn").addEventListener("click",downloadData);
$("copyBtn").addEventListener("click",copyData);
$("pickFileBtn").addEventListener("click",()=>$("importFile").click());
$("importBtn").addEventListener("click",()=>tryImport($("importText").value));
$("importFile").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>tryImport(String(rd.result));
  rd.onerror=()=>toast("文件读取失败", true);
  rd.readAsText(f);
  e.target.value="";
});

/* ---------- 初始化 ---------- */
(function init(){
  const first=createRole("调查员 · 一");
  WORLD.current=first;
  renderAll();
  renderCatTabs();
  renderLibrary();
})();

/* 键盘关闭弹窗 */
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });
</script>
